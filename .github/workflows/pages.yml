name: 部署官方组件广场

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'catalog/**'
      - 'site/**'
      - 'widgets/*/preview/**'
      - 'scripts/catalog.py'
      - 'scripts/widget.py'
      - 'docs/catalog-public-key.pem'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-widget-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 校验线上附件并生成目录与网页
        env:
          PUSH_BASE: ${{ github.event.before }}
        run: |
          args=()
          if [[ -n "$PUSH_BASE" && "$PUSH_BASE" != 0000000000000000000000000000000000000000 ]]; then
            args=(--base "$PUSH_BASE")
          fi
          python scripts/catalog.py build --out artifacts/site --verify-downloads "${args[@]}"
      - name: 使用 Ed25519 签名目录
        env:
          CATALOG_PRIVATE_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
        run: |
          test -n "$CATALOG_PRIVATE_KEY"
          umask 077
          key="$(mktemp "$RUNNER_TEMP/catalog-key.XXXXXX")"
          trap 'unlink "$key"' EXIT
          printf '%s\n' "$CATALOG_PRIVATE_KEY" > "$key"
          openssl pkeyutl -sign -rawin -inkey "$key" \
            -in artifacts/site/catalog.json -out artifacts/site/catalog.json.sig
          test "$(wc -c < artifacts/site/catalog.json.sig)" -eq 64
          openssl pkeyutl -verify -rawin -pubin -inkey docs/catalog-public-key.pem \
            -in artifacts/site/catalog.json -sigfile artifacts/site/catalog.json.sig
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        id: upload
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: artifacts/site
      - name: 等待 Pages 部署产物可见
        uses: actions/github-script@v8
        timeout-minutes: 1
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            const name = process.env.PAGES_ARTIFACT_NAME;
            const artifactId = process.env.PAGES_ARTIFACT_ID;
            if (!/^\d+$/.test(artifactId)) throw new Error('上传步骤未返回有效的 Pages 产物 ID');

            // 使用 deploy-pages@v4 的产物查询服务。运行器向 JavaScript 动作提供该服务的地址和令牌。
            const { ACTIONS_RUNTIME_TOKEN: token, ACTIONS_RESULTS_URL: serviceUrl } = process.env;
            const claims = token?.split('.')[1];
            if (!claims || !serviceUrl) throw new Error('运行器缺少产物服务配置');
            const { scp } = JSON.parse(Buffer.from(claims, 'base64url').toString('utf8'));
            const scope = scp?.split(' ').find(value => value.startsWith('Actions.Results:'))?.split(':');
            if (scope?.length !== 3 || !scope[1] || !scope[2]) {
              throw new Error('运行器令牌缺少当前任务的产物服务范围');
            }
            const [, workflowRunBackendId, workflowJobRunBackendId] = scope;
            const endpoint = new URL('/twirp/github.actions.results.api.v1.ArtifactService/ListArtifacts', serviceUrl);
            const request = {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
              body: JSON.stringify({
                workflow_run_backend_id: workflowRunBackendId,
                workflow_job_run_backend_id: workflowJobRunBackendId,
              }),
              redirect: 'error',
            };

            const attempts = 8;
            for (let attempt = 1; attempt <= attempts; attempt++) {
              const response = await fetch(endpoint, { ...request, signal: AbortSignal.timeout(4000) });
              if (!response.ok) throw new Error(`查询 Pages 内部产物失败（HTTP ${response.status}）`);
              const { artifacts = [] } = await response.json();
              if (!Array.isArray(artifacts)) throw new Error('Pages 内部接口返回的产物列表格式无效');
              const matches = artifacts.filter(artifact => artifact.name === name);
              if (matches.length > 1) throw new Error(`发现多个同名 Pages 产物 ${name}`);
              if (matches.length === 1) {
                const id = matches[0].database_id ?? matches[0].databaseId;
                if (String(id) !== artifactId) throw new Error(`Pages 产物 ${name} 的 ID 与本次上传不符`);
                core.info(`Pages 内部接口已查到产物 ${name}（ID ${artifactId}）`);
                return;
              }
              core.info(`Pages 内部接口暂未查到产物 ${name}（${attempt}/${attempts}）`);
              if (attempt < attempts) await new Promise(resolve => setTimeout(resolve, 3000));
            }
            throw new Error(`等待 Pages 内部接口登记产物 ${name}（ID ${artifactId}）超时`);
      - uses: actions/deploy-pages@v4
        id: deploy
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
