<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>汇率换算</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="component" aria-label="汇率换算">
    <header>
      <strong>汇率换算</strong>
    </header>
    <section id="currency-scroll" tabindex="0" aria-label="换算金额">
      <ul id="rows"></ul>
      <p id="empty" hidden>点击「＋」添加币种</p>
    </section>
    <footer>
      <div class="toolbar">
        <button id="add" type="button" aria-label="添加币种" title="添加币种">＋</button>
        <button id="refresh" type="button" aria-label="刷新汇率" title="刷新汇率">⟳</button>
        <button id="settings" type="button" aria-label="设置主题" title="设置主题">⚙</button>
      </div>
      <div id="source"><span>Frankfurter 参考汇率</span><time id="date"></time></div>
      <output id="status" role="status">等待公开数据</output>
    </footer>
  </main>
  <template id="currency-row">
    <li class="currency">
      <select></select>
      <input type="text" inputmode="decimal" maxlength="83" autocomplete="off" spellcheck="false">
      <button class="remove" type="button">×</button>
    </li>
  </template>
  <dialog id="dialog" aria-labelledby="theme-title">
    <form id="theme-form">
      <strong id="theme-title">主题设置</strong>
      <label>背景颜色<input name="background" type="color" required></label>
      <label>文字颜色<input name="foreground" type="color" required></label>
      <label>圆角<input name="radius" type="number" min="0" max="40" required></label>
      <output id="theme-error" role="status"></output>
      <div class="actions"><button id="cancel" type="button">取消</button><button type="submit">保存</button></div>
    </form>
  </dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
